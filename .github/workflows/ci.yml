name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run Unit Tests
        run: pytest -q

  train-and-evaluate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data
          curl -sL -o data/raw.csv "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv"

      - name: Baseline verification (no tuning)
        run: python -m src.baseline --config configs/config.yaml

      - name: Train model with GridSearchCV and MLflow
        env:
          MLFLOW_EXPERIMENT_NAME: churn-exp
        run: python -m src.train --config configs/config.yaml

      - name: Evaluate model and log artifacts
        env:
          MLFLOW_EXPERIMENT_NAME: churn-exp
        run: python -m src.evaluate --config configs/config.yaml

      - name: Verify MLflow server REST API
        run: python scripts/verify_mlflow_ui.py sqlite:///mlflow.db churn-exp ChurnClassifier

      - name: Upload MLflow results as pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results
          path: |
            mlflow.db
            mlruns/
          retention-days: 14

  docker-publish:
    runs-on: ubuntu-latest
    needs: train-and-evaluate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: churn-classifier:latest
